[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratumtap"
version = "0.1.0"
description = "Web front end and JSON API for a GPS-disciplined chrony NTP server (chrony + gpsd)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Holzhueter" }]
keywords = ["ntp", "chrony", "gpsd", "gps", "pps", "fastapi", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Time Synchronization",
]

dependencies = [
    "fastapi~=0.141.1",
    "uvicorn~=0.52.4",
    "pydantic~=2.13",
    "pydantic-settings~=2.15",
]

[project.optional-dependencies]
# aiomqtt is installed by default through requirements.txt (so a deployed Pi has it);
# this extra is for `pip install stratumtap[mqtt]`.
mqtt = ["aiomqtt~=2.5"]
dev = [
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "httpx~=0.28.1",
    "ruff~=0.16.4",
    "amqtt~=0.12",
]

[project.urls]
Homepage = "https://github.com/pwsh/StratumTap"
Documentation = "https://github.com/pwsh/StratumTap/blob/main/docs/api-contract.md"

[project.scripts]
stratumtap = "stratumtap.__main__:main"

[tool.setuptools.packages.find]
include = ["stratumtap*"]

[tool.setuptools.package-data]
stratumtap = ["static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", ".venv", "stratumtap/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["stratumtap"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
